<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Language Translator</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 800px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            resize: none;
            margin-bottom: 20px;
        }

        .language-box {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .language {
            flex: 1;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #444;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid #ddd;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        button:hover {
            background: #5568d8;
        }

        .result {
            background: #f5f5f5;
            border-radius: 10px;
            padding: 20px;
        }

        .result h3 {
            margin-bottom: 10px;
            color: #333;
        }

        #translation {
            min-height: 80px;
            font-size: 17px;
            color: #444;
            margin-bottom: 15px;
        }

        .copy-btn {
            width: auto;
            padding: 10px 20px;
            margin: 0;
            background: #28a745;
        }

        .copy-btn:hover {
            background: #218838;
        }

        @media (max-width: 600px) {
            .language-box {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🌍 Language Translator</h1>

        <p class="subtitle">
            Translate text easily between different languages
        </p>

        <form method="POST">

            <textarea
                name="text"
                placeholder="Enter text to translate..."
                required>{{ original_text }}</textarea>

            <div class="language-box">

                <div class="language">

                    <label>Source Language</label>

                    <select name="source_language">

                        {% for name, code in languages.items() %}

                        <option value="{{ name }}"
                            {% if name == source_language %}selected{% endif %}>
                            {{ name }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="language">

                    <label>Target Language</label>

                    <select name="target_language">

                        {% for name, code in languages.items() %}

                        <option value="{{ name }}"
                            {% if name == target_language %}selected{% endif %}>
                            {{ name }}
                        </option>

                        {% endfor %}

                    </select>

                </div>

            </div>

            <button type="submit">
                Translate
            </button>

        </form>


        <div class="result">

            <h3>Translated Text</h3>

            <div id="translation">
                {{ translated_text }}
            </div>

            <button class="copy-btn" onclick="copyText()">
                📋 Copy
            </button>

        </div>

    </div>


    <script>

        function copyText() {

            const text =
                document.getElementById("translation").innerText;

            navigator.clipboard.writeText(text);

            alert("Translation copied!");

        }

    </script>

</body>

</html>
